<!DOCTYPE html>
<html lang="en"> 
<head>

     <Title> PECO DECK </Title>
<link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">     
<style>
     body {
          font-family: "Indie Flower", cursive;
          text-align: center;
          margin: 0;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 20px;
          background-color: plum;
     }
     h1 {
          font-size: 70px;
          margin: 0;
     }

     button {
          font-family: "Indie Flower", cursive;
          font-size: 28px;
          padding: 18px 60px;
          border-radius: 20px;
          border: 2px solid #2b2b2b;
          background: white;
          cursor: pointer;
     }
     #menuscreen {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 30px;
     }
     .modal {
          display: none;
          position: fixed;
          inset: 0;
          background: rgba(0,0,0,0.6);
          align-items: center;
          justify-content: center;
     }
     .modal.open {
          display: flex;
     }
     .modalbox {
          background: white;
          padding: 40px 60px;
          border-radius: 20px;
          text-align: center;
     }
    
     </style>
</head>
<body>
     <h1> PECO DECK </h1>
          <button id = "startBtn"> START </button>
          <button id = "guideBtn"> GUIDE </button>
          <button id = "contactBtn"> CONTACT </button>
     <div id = "contactModal" class="modal">
        <div class = "modalbox">
          <h2> If you find any bugs or anything that is not working, please contact me on slack!</h2>
          <h3> @roverrover </h3>
          <button id = "closeContact"> CLOSE </button>
     </div>
</div>
<script>
     document.getElementById("startBtn").onclick = () => {
          window.location.href = "start.html";
     };
     document.getElementById("contactBtn").onclick = () => {
          document.getElementById("contactModal").classList.add("open");
     };
     document.getElementById("closeContact").onclick =() => {
          document.getElementById("contactModal").classList.remove("open");
     };
     
     </script>
</body>
</html>
