<!DOCTYPE html>
<html lang="en">
     <head>
          <Title> PECO DECK </Title>
               <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
               <style>
                    body {
                         margin: 0;
                         height: 100vh;
                         background: white;
                         font-family: "Indie flower", cursive;
                         overflow: hidden;

                    }
                    #bg {
                         position: absolute;
                         inset: 0;
                         background: white;
                         z-index: 0;

                    }
                    #cardSlot {
                         position: absolute;
                         left: 50%;
                         top: 50%;
                         transform: translate(-50%, -50%);
                         width: 700px;
                         height: 700px;
                         background-image: url("text.png");
                         background-size: 700px 700px;
                         background-repeat: no-repeat;
                         z-index: 1;
                         opacity: 0;
                         transition: opacity 0.5s ease;

                    }
                    #cardSlot.fade-out {
                    opacity: 0;
                    }

                    #cardSlot.show {
                         opacity: 1;
                    }
                    #cardSlot .sprite {
                         position: absolute;
                         left: 60px;
                         top: 330px;
                         transform: translateY(-50%);
                         width: 95px;
                         height: 95px;
                         object-fit: contain;
                    }
                    #cardSlot .text {
                         position: absolute;
                         left: 235px;
                         top: 320px;
                         transform: translateY(-50%);
                         font-size: 24px;
                         font-weight:700;
                         text-shadow: 0 0 1px white, 0 0 1px white;
                         color: white;
                         width: 400px;
                         text-align: center;
                         white-space: normal;
                    }
                    #foodBar {
                         position: absolute;
                         top: 20px;
                         left: 20px;
                         display: flex;
                         align-items: center;
                         gap: 8px;
                         padding: 6px 14px;
                         border: 2px solid #2b2b2b;
                         border-radius: 30px;
                         background: #fff;
                         font-family: "Indie Flower", cursive;
                         font-size: 20px;
                         color: #2b2b2b;
                         z-index: 5;
                    }
                    #foodBar .foodIcon {
                         font-size: 22px;
                         line-height: 1;
                    }

                    #foodBar .foodPlus {
                         cursor: pointer;
                         font-weight: 700;
                         color: #c0392b;
                         padding: 0 4px;
                    }
               
                    #sideBar {
                         position: fixed;
                         top: 60px;
                         right: 20px;
                         bottom: 20px;
                         width: 120px;
                         display: flex;
                         flex-direction: column;
                         gap: 20px;
                         z-index: 1;
                    }
                    #sideBar button {
                         flex: none;
                         height: 90px;
                         width: 100%;
                         font-family: "Indie flower", cursive;
                         font-size: 16px;
                         border: 2px solid #2b2b2b;
                         border-radius: 12px;
                         background: #fff;
                         cursor: pointer;
                    }
                    #cardStrip {
                         position: absolute;
                         left: 0;
                         right: 220px;
                         bottom: 0;
                         height: 110px;
                         display: flex;
                         align-items: flex-end;
                         gap: 10px;
                         padding: 10px;
                         box-sizing: border-box;
                         border: none;
                         z-index: 1
                    }
               

                    .card.locked {
                         filter: grayscale(100%) brightness(0.75);
                         opacity: 0.6;
                    }
                    #startBtn {
                         position: absolute;
                         right: 20px;
                         bottom: 20px;
                         width: 160px;
                         height: 70px;
                         font-family: "Indie Flower", cursive;
                         font-size: 28px;
                         border: 3px solid #2b2b2b;
                         border-radius: 20px;
                         background: white;
                         cursor: pointer;
                         z-index: 1;
                    }
                    .card {
                         flex: 1;
                         aspect-ratio: 3/4;
                         border: 2px solid #2b2b2b;
                         border-radius: 8px;
                         perspective: 800px;
                         cursor: pointer;

                    }
                    .card .inner {
                         position: relative;
                         width: 100%;
                         height: 100%;
                         transform-style: preserve-3d;
                         border-radius: 8px;
                    }
                    .card .front,
                    .card .back {
                         position: absolute;
                         inset: 0;
                         backface-visibility: hidden;
                         background-size: cover;
                         background-position: center;
                         border-radius: 8px;
                    }
                    .card .back {
                         transform: rotateY(180deg);
                         background-image: url("twice\ strategy\ nemo\ step\ 2\ ver\ photocard\ back\ scan.jpg");
                    }

                    #cardInfo {
                         position: absolute;
                         width: 190px;  
                         padding: 12px 14px;
                         border: 2px solid #2b2b2b;
                         border-radius: 12px;
                         background: #fff;
                         font-family: "Indie Flower", cursive;
                         font-size: 16px;
                         color: #2b2b2b;
                         z-index: 20;
                         opacity: 0;
                         pointer-events: none;
                         transform: translateY(6px);
                         transition: opacity 0.3s ease, transform 0.3s ease;
                    }

                    #cardInfo.show {
                         opacity: 1;
                         transform: translateY(0);
                    }

                    #cardInfo .infoName {
                         font-weight: 700;
                         font-size: 19px;
                         margin-bottom: 4px;
                    }

                    .card.spinning .inner {
                         animation: spinInner 1s cubic-bezier(0.4,0, 0.2, 1);
                    }
                    @keyframes spinInner {
                         0% { transform: rotateY(0deg); }
                         100% { transform: rotateY(360deg); }
                    }
               </style>

     </head>
     <body>
          <div id = "foodBar">
               <span class = "foodIcon">🍗</span>
               <span id = "foodCount"> 0 </span>
          </div>
          <div id = "bg"></div>
          <div id = "cardSlot">
               <img class = "sprite" src="sprite.png" alt="">
               <span class = "text"> Welcome, this is the tutorial for peco deck!</span>
          </div>
          
          <div id = "sideBar"> 
               <button id= "settingsBtn">⚙️</button>
               <button id = "binderBtn"> 📕 </button>
          </div>
          <div id = "cardInfo">
               <div class = "infoName"></div>
               <div class = "infoType"></div>
          </div>

          <div id = "cardStrip"></div>
          <button id = "startBtn"> PLAY </button>
          <script>
               function getFood() {
                    return parseInt(localStorage.getItem("food") || "0", 10);  
               }
               function setFood(n) {
                    localStorage.setItem("food", n);
                    document.getElementById("foodCount").textContent = n;
               };
               setFood(getFood());
               

               const textEl = document.querySelector("#cardSlot .text");
               let moved = false; 
               let tourDone = false;
               let typingTimer = null
                function typeText(message, onDone) {
                    clearInterval(typingTimer);
               textEl.textContent = "";
               let i = 0;
               const timer = setInterval(() => {
                    textEl.textContent += message[i];
                    i++;
                    if (i >= message.length) {
                         clearInterval(timer);
                         if(onDone) setTimeout(onDone, 1200);
                    }
                         
               }, 45);
                }

               function playLines(lines) {
                    if (lines.length === 0) { 
                    if (!tourDone);
                    return;
                    }
                    typeText(lines[0], () => playLines(lines.slice(1)));
               }
          if (!localStorage.getItem("startIntroDone")) {
               setTimeout(() => {
                    document.getElementById("cardSlot").classList.add("show");
                    playLines([
                         "Welcome, this is the tutorial for peco deck!",
                         "Remember, this is version 1.0",
                         "Let's begin.",
                         "click anywhere to advance.",
                    ]);
                    localStorage.setItem("startIntroDone", "1"); 
               },3000);
          }

               document.addEventListener("click", (e) => {
                    if (e.target.closest("button")) return;
                    if (!localStorage.getItem("startIntroDone")) return;
                    if (localStorage.getItem("BinderIntroDone") && !localStorage.getItem("FoodIntroDone")) return;
                    advance();
               });

          
               function advance() {
                    if (moved) return;
                    moved = true;
                    const slot = document.getElementById("cardSlot");
                    slot.classList.add("fade-out");
                    setTimeout(() => {
                         slot.style.left = "auto";
                         slot.style.right = "150px";
                         slot.style.top = "-180px";
                         slot.style.transform = "none";

                         typeText("This is your binder. All your cards live here!",() => {
                              typeText("Click on it!");
                         });
                         slot.classList.remove("fade-out");
                    }, 550);
               }
               document.getElementById("binderBtn").addEventListener("click",() => {
                    window.location.href = "binder.html";
               });

               if(localStorage.getItem("BinderIntroDone") && !localStorage.getItem("FoodIntroDone")) {
                    setTimeout(() => {
                         const slot = document.getElementById("cardSlot");
                         slot.classList.remove("fade-out");
                         slot.classList.add("show");
                         typeText("Now, food is something thats like the currency,", () => {
                              typeText("Its the currency that collects idols.", () => {
                                   slot.classList.add("fade-out");
                                   localStorage.setItem("FoodIntroDone", "1");
                              });
                         });

                    }, 400);
               }

               const groups = {
                    twice : {
                         rows : [
                              ["nayeon stratergy.jpg", "jeongyeon stratergy.jpg", "momo stratergy.jpg"],
                              ["sana stratergy.jpg", "jihyo stratergy.jpg", "minda stratergy.jpg"],
                              ["dahyun stratergy.jpg", "chaeyoung stratergy.jpg", "tzuyu stratergy.jpg"]
                    ]
                    }
               };
               const owned = JSON.parse(localStorage.getItem("ownedCards") || "[]");
               const starred = JSON.parse(localStorage.getItem("starredGroups") || "[]");
               const strip = document.getElementById("cardStrip");
               strip.innerHTML = "";
               
               const names = {
                    "nayeon": "Nayeon", "jeongyeon" : "Jeongyeon", "momo": "Momo", 
                    "sana": "Sana", "jihyo": "Jihyo", "mina": "Mina", 
                    "dahyun": "Dahyun", "chaeyoung": "Chaeyoung", "tzuyu": "Tzuyu"
               };
               const infoEl = document.getElementById("cardInfo");
               let openCard = null;
               let spinning = false;

               function closeInfo() {
                    if (openCard) openCard.classList.remove("flipped");
                    openCard = null;
                    infoEl.classList.remove("show");
               }
               strip.innerHTML = "";
               starred.forEach(g => {
                    groups[g].rows.forEach((rows, i) => {
                         rows.forEach((src, j) => {
                              const id = g +"-" + i + "-" + j;
                              const card = document.createElement("div");
                              card.className = "card";
                              const inner = document.createElement("div");
                              inner.className = "inner";
                              const front = document.createElement("div");
                              front.className = "front";
                              front.style.backgroundImage = 'url("' + src + '")';
                              const back = document.createElement("div");
                              back.className = "back";
                              inner.appendChild(front);
                              inner.appendChild(back);
                              card.appendChild(inner);

                              if (!owned.includes(id)) card.classList.add("locked");
                              card.addEventListener("click", (e) => {
                                   e.stopPropagation();
                                   if (!owned.includes(id)) {
                                        card.classList.add("shake");
                                        setTimeout(() => card.classList.remove("shake"), 400);
                                        return;
                                   }
                                   if (spinning) return;
                                   if (openCard === card) {
                                        closeInfo(); return; }
                                        closeInfo();
                                        spinning = true;
                                        card.classList.add("spinning");
                                        setTimeout(() => {
                                             card.classList.remove("spinning");
                                             spinning = false;
                                             openCard = card;
                                             const key = src.split(" ") [0].toLowerCase();
                                             infoEl.querySelector(".infoName").textContent = "Card name: " + (names[key] || key);
                                             infoEl.querySelector(".infoType").textContent = "Type: strategy " + (i + 1);
                                             const r = card.getBoundingClientRect();
                                             const panelW = 190, gap = 14;
                                             let left = r.right + gap;
                                             if (left + panelW > window.innerWidth - 20) left = r.left - panelW - gap;
                                             infoEl.style.left = left + "px";
                                             infoEl.style.top = (r.top + window.scrollY) + "px";
                                             infoEl.classList.add("show");
                                   }, 1000);
                              });
                              strip.appendChild(card);
                         });
                    });
               });

               document.addEventListener("click", () => closeInfo());

          </script>
     </body>
</html>
