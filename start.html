<!DOCTYPE html>
<html lang="en">
     <head>
          <Title> PECO DECK </Title>
               <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
               <style>
                    body {
                         margin: 0;
                         height: 100vh;
                         background: white;
                         font-family: "Indie flower", cursive;
                         overflow: hidden;

                    }
                    #bg {
                         position: absolute;
                         inset: 0;
                         background: white;
                         z-index: 0;

                    }
                    #cardSlot {
                         position: absolute;
                         left: 50%;
                         top: 50%;
                         transform: translate(-50%, -50%);
                         width: 700px;
                         height: 700px;
                         background-image: url("text.png");
                         background-size: 700px 700px;
                         background-repeat: no-repeat;
                         z-index: 1;
                         opacity: 0;
                         transition: opacity 0.5s ease;

                    }
                    #cardSlot.fade-out {
                    opacity: 0;
                    }

                    #cardSlot.show {
                         opacity: 1;
                    }
                    #cardSlot .sprite {
                         position: absolute;
                         left: 60px;
                         top: 330px;
                         transform: translateY(-50%);
                         width: 95px;
                         height: 95px;
                         object-fit: contain;
                    }
                    #cardSlot .text {
                         position: absolute;
                         left: 235px;
                         top: 320px;
                         transform: translateY(-50%);
                         font-size: 24px;
                         font-weight:700;
                         text-shadow: 0 0 1px white, 0 0 1px white;
                         color: white;
                         width: 400px;
                         text-align: center;
                         white-space: normal;
                    }
               
                    #sideBar {
                         position: fixed;
                         top: 60px;
                         right: 20px;
                         bottom: 20px;
                         width: 120px;
                         display: flex;
                         flex-direction: column;
                         gap: 20px;
                         z-index: 1;
                    }
                    #sideBar button {
                         flex: none;
                         height: 90px;
                         width: 100%;
                         font-family: "Indie flower", cursive;
                         font-size: 16px;
                         border: 2px solid #2b2b2b;
                         border-radius: 12px;
                         background: #fff;
                         cursor: pointer;
                    }
                    #cardStrip {
                         position: absolute;
                         left: 0;
                         right: 220px;
                         bottom: 0;
                         height: 110px;
                         display: flex;
                         align-items: flex-end;
                         gap: 10px;
                         padding: 10px;
                         box-sizing: border-box;
                         border: 3px solid #2b2b2b;
                         z-index: 1
                    }
                    .card {
                         flex: 1;
                         aspect-ratio: 3 / 4;
                         border: 2px solid #2b2b2b;
                         border-radius: 8px;
                         background: #f0f0f0;
                         background-size: cover;
                         background-position: center;
                    }

                    .card.locked {
                         filter: grayscale(100%) brightness(0.75);
                         opacity: 0.6;
                    }
                    #startBtn {
                         position: absolute;
                         right: 20px;
                         bottom: 20px;
                         width: 160px;
                         height: 70px;
                         font-family: "Indie Flower", cursive;
                         font-size: 28px;
                         border: 3px solid #2b2b2b;
                         border-radius: 20px;
                         background: white;
                         cursor: pointer;
                         z-index: 1;
                    }
               </style>
     </head>
     <body>
          <div id = "bg"></div>
          <div id = "cardSlot">
               <img class = "sprite" src="sprite.png" alt="">
               <span class = "text"> Welcome, this is the tutorial for peco deck!</span>
          </div>
          
          <div id = "sideBar"> 
               <button id= "settingsBtn">⚙️</button>
               <button id = "binderBtn"> 📕 </button>
          </div>

          <div id = "cardStrip">
               <div class ="card locked"></div>
               <div class = "card locked"></div>
               <div class = "card locked"></div>
               <div class = "card locked"></div>
               <div class = "card locked"></div>
               <div class = "card locked"></div>
               <div class = "card locked"></div>
               <div class = "card locked"></div>
               <div class = "card locked"></div>
          </div>
          <button id = "startBtn"> PLAY </button>
          <script>

               const textEl = document.querySelector("#cardSlot .text");
               let moved = false; 
               let tourDone = false;
               let typingTimer = null
                function typeText(message, onDone) {
                    clearInterval(typingTimer);
               textEl.textContent = "";
               let i = 0;
               const timer = setInterval(() => {
                    textEl.textContent += message[i];
                    i++;
                    if (i >= message.length) {
                         clearInterval(timer);
                         if(onDone) setTimeout(onDone, 1200);
                    }
                         
               }, 45);
                }

               function playLines(lines) {
                    if (lines.length === 0) { 
                    if (!tourDone);
                    return;
                    }
                    typeText(lines[0], () => playLines(lines.slice(1)));
               }
          if (!localStorage.getItem("startIntroDone")) {
               setTimeout(() => {
                    document.getElementById("cardSlot").classList.add("show");
                    playLines([
                         "Welcome, this is the tutorial for peco deck!",
                         "Remember, this is version 1.0",
                         "Let's begin.",
                         "click anywhere to advance.",
                    ]);
               },3000);
          }

               document.addEventListener("click", (e) => {
                    if (e.target.closest("button")) return;
                    
                    advance();
               })

          
               function advance() {
                    if (moved) return;
                    moved = true;
                    localStorage.setItem("startIntroDone", "1");

                    const slot = document.getElementById("cardSlot");
                    slot.classList.add("fade-out");
                    setTimeout(() => {
                         slot.style.left = "auto";
                         slot.style.right = "150px";
                         slot.style.top = "-180px";
                         slot.style.transform = "none";

                         typeText("This is your binder. All your cards live here!",() => {
                              typeText("Click on it!");
                         });
                         slot.classList.remove("fade-out");
                    }, 550);
               }
               document.getElementById("binderBtn").addEventListener("click",() => {
                    window.location.href = "binder.html";
               });

               const groups = {
                    twice : {
                         rows : [
                              ["nayeon stratergy.jpg", "jeongyeon stratergy.jpg", "momo stratergy.jpg"],
                              ["sana stratergy.jpg", "jihyo stratergy.jpg", "mina stratergy.jpg"],
                              ["dahyun stratergy.jpg", "chaeyoung stratergy.jpg", "tzuyu stratergy.jpg"]
                    ]
                    }
               };
               const crowned = JSON.parse(localStorage.getItem("crownedCards") || "[]");
               if (crowned.length > 0) {
                    const parts = crowned[crowned.length - 1].split("-");
                    const src = groups[parts[0]].rows[+parts[1]][+parts[2]];
                    const icon = document.getElementById("binderBtn");
                    icon.style.backgroundImage = 'url("' + src + '")';
                    icon.style.backgroundSize = "cover";
               }
         
          

          </script>
     </body>
</html>
